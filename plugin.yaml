name: hermes-manas-aegis
version: 2.6.6
description: "[ALPHA] Experimental Hermes guardrail (prototype, not standalone security): pattern-based pre-tool checks that can block or rewrite some risky tool arguments, with local telemetry and a loopback HUD. Opt-in, test environments only — see README.md for limits."
author: "Alianza Meridian Corp"
license: "MIT"
homepage: "https://github.com/elianjuan-g/hermes-manas-aegis"
repository: "https://github.com/elianjuan-g/hermes-manas-aegis"
entrypoint: "hermes_manas_aegis:register"
min_hermes_version: "0.21.0"
categories:
  - security
  - guardrails
  - desktop
  - monitoring
tags:
  - guardrail
  - pattern-matching
  - honeypot-decoy
  - mitre-attack
  - stix-local
  - desktop-ui

provides:
  hooks:
    - on_session_start
    - pre_llm_call
    - pre_tool_call
    - transform_tool_result
    - transform_llm_output
  tools:
    - manas_tactical_core
    - manas_stix_intelligence
  commands:
    - /manas-hud
    - /manas-barrage
    - /manas-stix

# Top-level provides_* lists (v2.6.3): `hermes plugins validate` and the
# loader read ONLY these keys — the nested `provides:` block above is
# not seen by the validator, so the registered tools/hooks were
# reported as "undeclared". Keep both in sync.
provides_tools:
  - manas_tactical_core
  - manas_stix_intelligence
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_tool_call
  - transform_tool_result
  - transform_llm_output

config_schema:
  tactical_doctrine:
    type: string
    default: "counter_deceive"
    enum: ["counter_deceive", "ssvc_enforce", "stealth_audit"]
    description: "counter_deceive redirects credential reads to Canary Honeypot decoys; ssvc_enforce and stealth_audit have no behaviour in code — they are only enum values, with no SSVC gate anywhere. The only doctrine branch is 'counter_deceive' (credential reads are redirected); any other doctrine falls through to HARD_BLOCK for credential reads. Doctrine only changes credential-read behaviour; it does not hard-block all ACT/ATTEND decisions."
  auto_launch_hud_server:
    type: boolean
    default: true
    description: "Start local Analytical Matrix UI server on 127.0.0.1:18777 for Hermes Desktop & Browser telemetry."
  hud_port:
    type: integer
    default: 18777
    description: "Local port for the live Analytical Core UI."
  git_rce_synthesis:
    type: boolean
    default: true
    description: "Automatically rewrite git commands with safe flags to neutralize malicious repository config hooks (CWE-78)."
  ssrf_dns_firewall:
    type: boolean
    default: true
    description: "Pre-resolve DNS and block RFC1918, loopback, and cloud metadata SSRF (CWE-918)."
  taint_ttl_minutes:
    type: integer
    default: 60
    description: "How long (minutes) a session stays tainted after a credential read before egress is allowed again. In-memory only; simulation never sets taint."
  ssrf_allowlist:
    type: array
    default: []
    description: "Named hosts trusted by the operator; SSRF validation is skipped for them. Use hostnames only (example: trusted.internal)."
  callid_race_window_s:
    type: integer
    default: 10
    description: "Window (seconds) in which an identical runtime tool call (same session + tool + arguments hash) is hard-blocked as a duplicate."
  callid_race_enabled:
    type: boolean
    default: true
    description: "Enable the duplicate-call race shield for runtime tool calls. Simulation and arena runs are always exempt."
  hud_auth_token:
    type: string
    default: ""
    description: "Shared secret for the loopback HUD login: when set, the HUD login page requires this token (submitted once, then a 24h HttpOnly session cookie). Empty means a token is generated automatically on first start and stored in the plugin-data dir (hud_auth_token.txt, mode 0600); the login page shows the file location. The HUD always requires login."
